# =============================================================================
# qcar2_planner — Configuration Parameters
# =============================================================================

map_overlay_node:
  ros__parameters:
    # --- Alignment Mode ---
    alignment_mode: "auto" # 'auto' (ICP) or 'manual' (/initialpose)
    
    # --- ICP Parameters ---
    icp_max_iterations: 9666 # Maximos intentos (iteraciones) para lograr alinear los mapas
    icp_convergence_threshold: 1.5 # Tolerancia de precision: Si mejora menos que esto, asume que termino
    icp_max_correspondence_dist: 3.9 # Distancia maxima (metros) para buscar la correspondencia de un punto
    icp_downsample_resolution: 0.01 # Tamano (metros) para agrupar puntos y aligerar el calculo
    icp_min_cartographer_points: 50 # Minimo de puntos de pared que Cartographer DEBE ver para arrancar
    overlay_max_lidar_range_m: 6.0 # Radio maximo (metros) alrededor del robot que se usara para buscar paredes
    icp_min_wall_component_size: 90 # Tamano minimo (en celdas) que debe tener una pared para ignorar basuritas
    
    # --- Map Processing ---
    morph_kernel_size: 0
    border_dilation_px: 2 # dilate PGM borders for better ICP matching
    pgm_scale_factor: 0.479 # Scale the image pixels when loading
    
    # --- Lane Layer ---
    lanes_yaml_path: "/workspaces/isaac_ros-dev/ros2/src/qcar2_planner/config/lanes.yaml"  # set via launch arg or leave empty (auto-detects from map dir)
    
    # --- Publishing ---
    publish_rate: 0.1
    map_frame: "map"
    
    # --- Output Topics ---
    occupancy_out_topic: "/planner_occupancy"
    uncertainty_out_topic: "/planner_uncertainty"
    gridmap_out_topic: "/grid_map"

directional_planner_server:
  ros__parameters:
    # --- TF Frames ---
    map_frame: "pgm_map"
    base_frame: "base_link" # robot heading frame (NOT odom!)

    # --- Planner ---
    # enforce_lane_mask: [true/false] Si es true, la busqueda A* solo es valida dentro de la mascara de carriles.
    enforce_lane_mask: true
    # min_direction_dot: Alineacion (producto punto) requerida con el vector del carril. Subir: Exige mas paralelismo al carril (evita cruces bruscos). Bajar: Permite movimientos mas libres y cruces transversales.
    min_direction_dot: 0.4
    # direction_penalty: Costo por ir en sentido contrario. Subir: Vuelve practicamente imposible ir contra el flujo. Bajar: Permite maniobras prohibidas si es la unica salida.
    direction_penalty: 1.0e6
    # occupancy_threshold: Umbral para pared. Subir: Ignora sombras y manchas oscuras tenues. Bajar: Se vuelve cauteloso tomando cualquier sombra como obstaculo duro.
    occupancy_threshold: 0.5
    # safety_margin_cells: Radio de inflacion alrededor de obstaculos. Subir: Aleja al coche de paredes (puede cerrar pasos estrechos). Bajar: Le permite pasar rozando paredes.
    safety_margin_cells: 1 # 0 for loaded maps (narrow roads get blocked by inflation)

    # --- Independent Lanes ---
    # use_independent_lanes: [true/false] Si es true, aisla el procesamiento por cada ID de carril para evitar brincos no deseados.
    use_independent_lanes: true
    # enforce_lane_successors: [true/false] Exige que un salto de carril este explicitamente definido como valido en lanes.yaml.
    enforce_lane_successors: true
    # connection_threshold_m: Tolerancia 0.3 (m) de distancia para saltar a un carril si no hay definicion en YAML. Subir: Permite encontrar atajos saltando a carriles lejanos. Bajar: Te encierra estrictamente en la trayectoria actual.
    connection_threshold_m: 0.30
    lanes_yaml_path: "/workspaces/isaac_ros-dev/ros2/src/qcar2_planner/config/lanes.yaml"  # set via launch arg or auto-detect from config dir

    # --- Debug ---
    # publish_path_markers: [true/false] Dibuja la ruta verde final en RViz.
    publish_path_markers: true

    # --- Goal Input (configurable topic) ---
    goal_input_topic: "/bt/goal"

    # --- Semi-Goal Navigation ---
    mission_goals_topic: "/mission_goals"
    semi_goals_markers_topic: "/semi_goals_markers"
    # semi_goal_spacing_m: Distancia base/legacy entre puntos de la ruta que se envian a Nav2 (usado si use_adaptive_semigoal_spacing es false).
    semi_goal_spacing_m: 0.38
    # semi_goal_tolerance: Precision con la que Nav2 debe atinar al punto antes de pasar al siguiente. Subir: Movimiento ininterrumpido (pasa "cerca" y avanza). Bajar: El coche se frena intentando cuadrarse exacto en cada punto.
    semi_goal_tolerance: 0.26
    
    # --- Curve Safe Semigoal Spacing ---
    # use_curve_safe_semigoal_spacing: [true/false] Si es true, ajusta dinámicamente la distancia en curvas y verifica segmentos para evitar cortar esquinas.
    use_curve_safe_semigoal_spacing: true
    straight_semigoal_spacing_m: 0.35
    curve_semigoal_spacing_m: 0.18
    max_curve_segment_length_m: 0.22
    curve_segment_check_step_m: 0.02

    # --- Ackermann Curve Yaw Offset ---
    use_ackermann_curve_yaw_offset: true
    curve_detection_window: 5
    curve_min_consecutive_angle_changes: 3
    curve_delta_angle_min_deg: 3.0
    curve_delta_angle_std_max_deg: 8.0
    curve_total_angle_min_deg: 12.0
    
    curve_yaw_offset_max_deg: 5.0
    curve_yaw_offset_min_deg: 0.5
    curve_yaw_ramp_in_ratio: 0.50
    curve_yaw_ramp_out_ratio: 0.50
    curve_yaw_rate_limit_deg: 2.0
    
    use_right_boundary_adaptive_opening: true
    right_boundary_check_distance_m: 0.35
    right_boundary_near_m: 0.12
    right_boundary_far_m: 0.35
    right_boundary_check_step_m: 0.02
    minimum_opening_if_no_right_boundary_deg: 0.0

    use_no_right_boundary_curve_tightening: true
    no_right_boundary_tightening_gain: 0.55
    no_right_boundary_near_m: 0.12
    no_right_boundary_far_m: 0.30
    no_right_boundary_check_distance_m: 0.45
    no_right_boundary_check_step_m: 0.02
    max_no_boundary_opening_reduction_ratio: 0.65

    # --- Post-Curve Straight Counteroffset ---
    use_post_curve_straight_counteroffset: true
    post_curve_counteroffset_m: 0.05
    post_curve_counteroffset_max_m: 0.10
    post_curve_counteroffset_distance_m: 0.70
    post_curve_counteroffset_ramp_in_m: 0.15
    post_curve_counteroffset_ramp_out_m: 0.25
    post_curve_straight_angle_threshold_deg: 6.0
    post_curve_min_total_angle_deg: 12.0
    post_curve_right_boundary_trigger_m: 0.22
    post_curve_counteroffset_check_step_m: 0.02
    post_curve_counteroffset_direction: "left"

    # --- Auto-enable (set via launch, not here) ---
    auto_enable: false

    # --- Ackermann Constraints ---
    # max_turn_angle_deg: Limite maximo de giro (steering) que el planificador cree que puede dar. Subir: Planea curvas cerradas (que el hardware real podria no dar). Bajar: Solo entrega rutas muy suaves.
    max_turn_angle_deg: 49.0 # max turn angle (>120° = hard-blocked)
    # right_bias_penalty: Que tan fuerte se castiga ir por la izquierda. Subir: Se pega agresivamente al borde derecho del carril. Bajar: Ignora la derecha y viaja por el centro exacto.
    right_bias_penalty: 0.15 # gradient-based right wall attraction strength 0.9
    # forward_lock_cells: Bloqueo de inicio. Celdas obligatorias en linea recta al empezar. Subir: Arranca derecho mucho tramo antes de dar vuelta. Bajar: Volantea abruptamente desde la celda de inicio.
    forward_lock_cells: 45 # strict 90° forward within this radius (cells from start)

    # --- Edge Clearance Cost (penalizacion suave por cercania al borde del lane) ---
    # use_edge_clearance_cost: [true/false] Si es true, suma un costo extra a las celdas cercanas al borde del carril para empujar la ruta hacia el centro.
    use_edge_clearance_cost: true
    # edge_clearance_weight: Peso del costo de clearance. Subir: Empuja la ruta mas agresivamente al centro. Bajar: Efecto sutil, la ruta casi no se mueve.
    edge_clearance_weight: 0.08
    # min_clearance_to_lane_edge_m: Distancia (metros) desde el borde del carril donde se aplica penalizacion. Celdas mas lejos que esto no reciben ningun costo extra.
    min_clearance_to_lane_edge_m: 0.16

    # --- Curve Inner Clearance Cost (penalizacion solo en el borde interno de las curvas) ---
    # use_curve_clearance_cost: [true/false] Si es true, añade un costo solo en el interior de las curvas para forzar a que el A* abra la curva y no muerda la acera.
    use_curve_clearance_cost: true
    # curve_clearance_weight: Peso del costo. Subir: Castiga fuertemente acercarse al borde interno.
    curve_clearance_weight: 0.30
    # curve_angle_threshold_deg: Angulo minimo (grados) entre segmentos para considerar que el carril está doblando.
    curve_angle_threshold_deg: 15.0
    # curve_inner_clearance_m: Distancia (metros) desde el borde interno hacia el centro del carril que recibirá penalización de curva.
    curve_inner_clearance_m: 0.25

    # --- Path Postprocessing (limpieza del path antes de generar semi-goals) ---
    # use_path_postprocessing: [true/false] Si es true, aplica limpieza y suavizado al path de A* antes de generar semi-goals. Si es false, el path se usa tal cual.
    use_path_postprocessing: false
    # path_smoothing_window: Ventana del moving average. Subir: Suaviza mas agresivamente (puede cortar curvas). Bajar: Mantiene la forma original con mínimo suavizado.
    path_smoothing_window: 3
    # path_prune_collinear_tolerance_m: Tolerancia (metros) para eliminar puntos casi alineados. Subir: Elimina mas puntos intermedios. Bajar: Conserva mas detalle.
    path_prune_collinear_tolerance_m: 0.01
    # max_smoothing_shift_m: Maximo desplazamiento (metros) que el suavizado puede mover un punto. Subir: Permite curvas mas suaves pero puede sacar del carril. Bajar: Limita el suavizado para no alejarse del path original.
    max_smoothing_shift_m: 0.40

    # --- Semi-Goal Zigzag Cleanup (correccion local de zigzags en semi-goals) ---
    # use_semigoal_zigzag_cleanup: [true/false] Si es true, analiza tripletas de semi-goals y corrige zigzags locales sin modificar todo el path. Funciona independientemente de use_path_postprocessing.
    use_semigoal_zigzag_cleanup: true
    # prefer_zigzag_correction_over_deletion: [true/false] Si es true, prioriza proyectar el punto para corregirlo en lugar de eliminarlo (preserva mejor la cantidad de puntos).
    prefer_zigzag_correction_over_deletion: true
    # max_semigoal_deletions_per_path: Limite maximo de puntos que se pueden eliminar por cada ruta generada para no despoblar el path.
    max_semigoal_deletions_per_path: 2
    # min_semigoals_to_keep: Cantidad minima de semi-goals que debe tener el path para permitir una eliminacion.
    min_semigoals_to_keep: 5
    # max_direct_segment_after_deletion_m: Distancia maxima (metros) que puede tener el segmento resultante si se elimina el punto central. Si es mayor, no se elimina.
    max_direct_segment_after_deletion_m: 0.35
    # zigzag_angle_threshold_deg: Angulo minimo (grados) entre segmentos consecutivos para considerar zigzag. Subir: Solo corrige quiebres muy pronunciados. Bajar: Detecta desviaciones mas sutiles.
    zigzag_angle_threshold_deg: 25.0
    # zigzag_lateral_threshold_m: Distancia lateral minima (metros) del punto medio al segmento directo para considerar zigzag. Subir: Ignora desviaciones pequenas. Bajar: Detecta hasta micro-desviaciones.
    zigzag_lateral_threshold_m: 0.03
    # max_zigzag_fix_shift_m: Maximo desplazamiento (metros) al proyectar un punto zigzag sobre el segmento directo. Subir: Permite correcciones mas agresivas. Bajar: Limita el movimiento del punto.
    max_zigzag_fix_shift_m: 0.08
    # semigoal_segment_check_step_m: Paso (metros) para muestrear puntos al validar que un segmento es lane-safe. Subir: Validacion mas rapida pero menos precisa. Bajar: Validacion exhaustiva celda por celda.
    semigoal_segment_check_step_m: 0.02

    # --- Semi-Goal Yaw Validation (reparación robusta de orientación antes de publicar) ---
    # use_semigoal_yaw_validation: [true/false] Si es true, recalcula y repara orientaciones de semi-goals usando tangentes locales robustas. Corrige flechas perpendiculares, invertidas o aleatorias causadas por puntos sobrelapados o filtros previos.
    use_semigoal_yaw_validation: true
    # min_yaw_segment_distance_m: Distancia mínima (metros) entre dos puntos para considerar su atan2 confiable. Pares más cercanos se ignoran y se busca un vecino más lejano.
    min_yaw_segment_distance_m: 0.08
    # max_yaw_jump_deg: Salto máximo (grados) entre el yaw actual y el yaw_base calculado por tangente. Si se excede, el yaw se marca como inválido y se repara.
    max_yaw_jump_deg: 45.0
    # yaw_smoothing_window: Ventana de suavizado angular. Solo suaviza cambios pequeños; nunca introduce saltos mayores a max_yaw_jump_deg.
    yaw_smoothing_window: 3
    # preserve_final_goal_yaw: [true/false] Si es true, conserva la orientación exacta del goal final sin modificarla, pero loggea warning si difiere mucho de la trayectoria.
    preserve_final_goal_yaw: true
    # repair_bad_yaw_using_neighbors: [true/false] Si es true, reemplaza yaw inválidos con yaw_base de tangente local. Si es false, solo loggea warning sin corregir.
    repair_bad_yaw_using_neighbors: true

    # --- Semi-Goal Sanitizer (limpieza final obligatoria antes de publicar) ---
    # use_semigoal_sanitizer: [true/false] Si es true, elimina semi-goals duplicados o demasiado cercanos, valida lane-safety y recalcula yaw robusto. Siempre se ejecuta al final del pipeline.
    use_semigoal_sanitizer: true
    # min_semigoal_distance_m: Distancia mínima (metros) entre semi-goals consecutivos en rectas. Semi-goals más cercanos se descartan si el segmento resultante es lane-safe.
    min_semigoal_distance_m: 0.22
    # min_semigoal_distance_curve_m: Distancia mínima en curvas. Puede ser menor que en rectas para mantener resolución.
    min_semigoal_distance_curve_m: 0.18
    # duplicate_semigoal_epsilon_m: Distancia por debajo de la cual dos puntos se consideran duplicados y se descartan directamente.
    duplicate_semigoal_epsilon_m: 0.04
    # max_semigoal_filter_iterations: Iteraciones máximas del filtro de distancia. Más iteraciones = más limpieza.
    max_semigoal_filter_iterations: 3
    # max_semigoals_removed_per_path: Limite de semi-goals removidos por path para no despoblar la trayectoria.
    max_semigoals_removed_per_path: 5
    # preserve_first_semigoal: [true/false] Siempre conservar el primer semi-goal.
    preserve_first_semigoal: true
    # preserve_final_goal: [true/false] Siempre conservar el ultimo semi-goal (goal final).
    preserve_final_goal: true
    # semigoal_marker_scale: Escala visual (metros) de los markers de semi-goals en RViz.
    semigoal_marker_scale: 0.25

map_loader_node:
  ros__parameters:
    # --- Map File ---
    map_yaml_path: "/workspaces/isaac_ros-dev/ros2/src/qcar2_planner/config/map_ros.yaml" # set via launch arg

    # --- Lane Layer ---
    lanes_yaml_path: "/workspaces/isaac_ros-dev/ros2/src/qcar2_planner/config/lanes.yaml"  # set via launch arg or leave empty (auto-detects from map dir)

    # --- Morphological Post-Processing ---
    morph_kernel_size: 0 # kernel for opening + closing

    # --- Publishing ---
    publish_rate: 0.1
    map_frame: "map"

    # --- Output Topics ---
    uncertainty_out_topic: "/planner_uncertainty"
    gridmap_out_topic: "/grid_map"
