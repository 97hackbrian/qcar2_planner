# =============================================================================
# qcar2_planner — Configuration Parameters
# =============================================================================

map_processor_node:
  ros__parameters:
    # --- Input Topics ---
    mesh_marker_topic: "/nvblox_node/mesh_marker"

    # --- TF Frames ---
    map_frame: "map"
    base_frame: "base_link"

    # --- Grid Map Dimensions ---
    map_resolution: 0.05        # meters per cell
    map_size_x: 20.0            # meters (total width)
    map_size_y: 20.0            # meters (total height)
    map_origin_x: 0.0           # center of the map in world coords
    map_origin_y: 0.0

    # --- Flattening (3D → 2D) ---
    z_min: -0.5                 # min z to consider (meters)
    z_max: 2.0                  # max z to consider (meters)

    # --- Morphological Closure ---
    kernel_size: 5              # NxN kernel for cv2.morphologyEx(MORPH_CLOSE)

    # --- Uncertainty Model ---
    hits_threshold: 20          # N_threshold: observations needed for full certainty

    # --- Publishing ---
    publish_rate: 2.0           # Hz — rate of GridMap publication

    # --- Debug ---
    show_debug_window: true     # OpenCV imshow of uncertainty heatmap

exploration_manager_node:
  ros__parameters:
    # --- Uncertainty Threshold (τ) ---
    uncertainty_threshold: 0.15

    # --- Working Area (Lidar range quadrilateral) ---
    work_area_x_min: -10.0
    work_area_x_max: 10.0
    work_area_y_min: -10.0
    work_area_y_max: 10.0

    # --- Frontier Detection ---
    frontier_min_size: 5        # minimum cells to qualify as frontier cluster
    gradient_threshold: 0.3     # uncertainty gradient to detect frontier boundary

    # --- Publishing ---
    publish_rate: 1.0           # Hz

directional_planner_server:
  ros__parameters:
    # --- Planner ---
    direction_penalty: 1.0e6    # large penalty for wrong-way traversal (≈∞)
    occupancy_threshold: 0.5    # cells with occupancy above this are obstacles
    safety_margin_cells: 2      # inflate obstacles by this many cells

    # --- Debug ---
    publish_path_markers: true  # publish arrow MarkerArray on /path_arrows
