# =============================================================================
# qcar2_planner — Configuration Parameters
# =============================================================================

map_overlay_node:
  ros__parameters:
    # --- Alignment Mode ---
    alignment_mode: "auto" # 'auto' (ICP) or 'manual' (/initialpose)
    
    # --- ICP Parameters ---
    icp_max_iterations: 366
    icp_convergence_threshold: 0.01
    icp_max_correspondence_dist: 1.9
    icp_downsample_resolution: 0.1
    icp_min_cartographer_points: 200
    overlay_max_lidar_range_m: 6.0
    icp_min_wall_component_size: 90
    
    # --- Map Processing ---
    morph_kernel_size: 0
    border_dilation_px: 0 # dilate PGM borders for better ICP matching
    pgm_scale_factor: 0.479 # Scale the image pixels when loading
    
    # --- Publishing ---
    publish_rate: 0.5
    map_frame: "map"
    
    # --- Output Topics ---
    occupancy_out_topic: "/planner_occupancy"
    uncertainty_out_topic: "/planner_uncertainty"
    gridmap_out_topic: "/grid_map"

directional_planner_server:
  ros__parameters:
    # --- TF Frames ---
    map_frame: "pgm_map"
    base_frame: "base_link" # robot heading frame (NOT odom!)

    # --- Planner ---
    direction_penalty: 1.0e6
    occupancy_threshold: 0.5
    safety_margin_cells: 0 # 0 for loaded maps (narrow roads get blocked by inflation)

    # --- Debug ---
    publish_path_markers: true

    # --- Goal Input (configurable topic) ---
    goal_input_topic: "/bt/goal"

    # --- Semi-Goal Navigation ---
    mission_goals_topic: "/mission_goals"
    semi_goals_markers_topic: "/semi_goals_markers"
    semi_goal_spacing_m: 0.3
    semi_goal_tolerance: 0.22

    # --- Auto-enable (set via launch, not here) ---
    auto_enable: false

    # --- Ackermann Constraints ---
    max_turn_angle_deg: 49.0 # max turn angle (>120° = hard-blocked)
    right_bias_penalty: 0.15 # gradient-based right wall attraction strength 0.9
    forward_lock_cells: 45 # strict 90° forward within this radius (cells from start)

map_loader_node:
  ros__parameters:
    # --- Map File ---
    map_yaml_path: "/workspaces/isaac_ros-dev/ros2/src/qcar2_planner/config/map_ros.yaml" # set via launch arg

    # --- Morphological Post-Processing ---
    morph_kernel_size: 0 # kernel for opening + closing

    # --- Publishing ---
    publish_rate: 0.5
    map_frame: "map"

    # --- Output Topics ---
    uncertainty_out_topic: "/planner_uncertainty"
    gridmap_out_topic: "/grid_map"
